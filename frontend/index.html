<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sanya Messenger</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="avatar" id="brandAvatar">S</div>
        <div>
          <div class="brand-title">Sanya</div>
          <div class="brand-sub" id="statusText">Messenger</div>
        </div>
      </div>
      <button id="adminBtn" class="icon-btn hidden" aria-label="Admin">☰</button>
    </header>

    <main>
      <section id="homeView" class="view">
        <div class="hero">
          <div class="hero-avatar">S</div>
          <h1>Message Sanya</h1>
          <p>Private messaging inside Telegram.</p>
          <div id="planBadge" class="plan-badge">Checking Premium…</div>
          <button id="openChatBtn" class="primary-btn">Open Messages</button>
          <button id="subscribeBtn" class="secondary-btn">Get Premium · 299 ⭐</button>
        </div>
      </section>

      <section id="chatView" class="view hidden">
        <div class="chat-head">
          <button id="backBtn" class="icon-btn">‹</button>
          <div class="mini-avatar">S</div>
          <div>
            <strong>Sanya</strong>
            <small>Private chat</small>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <div id="composer" class="composer">
          <input id="messageInput" maxlength="4000" placeholder="Message…" autocomplete="off">
          <button id="sendBtn" class="send-btn">➤</button>
        </div>
      </section>

      <section id="adminView" class="view hidden">
        <div class="admin-head">
          <button id="adminBackBtn" class="icon-btn">‹</button>
          <h2>Admin Inbox</h2>
        </div>
        <div id="conversationList" class="conversation-list"></div>
        <div id="adminChat" class="admin-chat hidden">
          <div id="adminChatMessages" class="messages"></div>
          <div class="composer">
            <input id="adminMessageInput" maxlength="4000" placeholder="Reply…">
            <button id="adminSendBtn" class="send-btn">➤</button>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
